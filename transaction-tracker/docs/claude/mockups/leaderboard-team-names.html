<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Helvetica Neue',Arial,sans-serif;color:#1B1B1B;background:#fff}
.w{max-width:480px;margin:0 auto;padding:12px 16px}
h2{font:700 12px 'Helvetica Neue';letter-spacing:1.2px;color:#B45A22;text-transform:uppercase;margin:14px 0 4px}
.sub{font-size:12px;color:#6B7280;margin-bottom:6px}
table{width:100%;border-collapse:collapse}
td{padding:7px 4px;border-bottom:1px solid #F1F2F4;vertical-align:middle}
td.pos{width:24px;color:#6B7280;font-weight:700}
td.th{width:34px;text-align:right;color:#6B7280;font-size:12px}
td.tp{width:40px;text-align:right;font:700 16px Bitter,Georgia,serif;color:#B91C1C}
tr.me td{background:#FFF4EC} tr.me td.pos{box-shadow:inset 3px 0 0 #E87C3E}
.cart{display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap}
.cart + .cart{margin-top:4px}
.p{display:inline-flex;align-items:baseline;gap:4px;min-width:0}
.p em{font-style:normal;font-size:12px;color:#6B7280}
.p b{font:700 15px/1.3 Bitter,Georgia,serif;text-transform:uppercase}
.dot{color:#C4C4C4;font-size:14px}
.meta{font-size:11px;color:#6B7280;margin-top:3px}
</style></head><body><div class="w">
<h2>Team Net (18) · best 2 of 4</h2><div class="sub">Each line is a cart. First name small, LAST NAME in Bitter, on one line.</div>
<table id="t18"></table>
<h2 style="margin-top:20px">Cart Net (9) · best ball of 2</h2><div class="sub">One line per cart.</div>
<table id="t9"></table>
</div><script>
const P=(f,l)=>`<span class="p"><em>${f}</em><b>${l}</b></span>`;
const cart=(a,b)=>`<div class="cart">${P(...a)}<span class="dot">•</span>${P(...b)}</div>`;
const row=(pos,carts,meta,thru,net,me)=>`<tr class="${me?"me":""}"><td class="pos">${pos}</td><td>${carts.map(c=>cart(...c)).join("")}<div class="meta">${meta}</div></td><td class="th">${thru}</td><td class="tp">${net}</td></tr>`;
document.getElementById("t18").innerHTML=[
 row(1,[[["Ray","Delgado"],["Luis","Garza"]],[["Ann","Lee"],["Sam","Park"]]],"Group 5",12,-11),
 row(2,[[["Kerry","Niester"],["Brian","Thompson"]],[["Dan","Stich"],["Mary","Wade"]]],"Group 3 · your group",10,-9,1),
 row(3,[[["Tom","Alvarez"],["Joe","Reyes"]],[["Min","Cho"],["Rosa","Diaz"]]],"Group 1",12,-7),
 row(4,[[["Chris","Benton"],["Sam","Ortiz"]],[["Eli","Ruiz"],["Pat","Hale"]]],"Group 4",9,-4)].join("");
document.getElementById("t9").innerHTML=[
 row(1,[[["Dan","Stich"],["Mary","Wade"]]],"Group 1 · your group",6,-6,1),
 row(2,[[["Ray","Delgado"],["Joe","Reyes"]]],"Group 3",7,-5),
 row("T3",[[["Tom","Alvarez"],["Sam","Ortiz"]]],"Group 2",7,-3),
 row("T3",[[["Kerry","Niester"],["Brian","Thompson"]]],"Group 1 · your group",6,-3,1)].join("");
</script></body></html>
