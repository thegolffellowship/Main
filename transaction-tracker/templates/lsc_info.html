<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lone Star Cup 2026 · Event Info</title>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Standard Cup navy (Kerry 10/8 via CoS #1456: "let's make the 002855 the standard Cup navy"): PMS 281 C, RGB 0/40/85. Cup surfaces only. */
    :root { --lsc-navy: #002855; }
    /* LONE STAR CUP EVENT INFO (CoS #1398 / #1428, mockup EventInfo.dc.html
       canvas v29): SCHEDULE | TEAMS | FORMATS, one at a time, with anchors
       #schedule #teams #formats #fourball #foursomes #singles #skins (Track
       A's HOW IT WORKS pill links here). Teams are read from the live Cup
       dial; the rest is the mockup's text. Members never see dollars. */
    * { box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; color: var(--lsc-navy);
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .bar { background: var(--lsc-navy); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .bar img { width: 34px; height: 34px; }
    .bar a.back { margin-left: auto; color: #FFFFFF; text-decoration: none; background: var(--lsc-navy);
                  border-radius: 99px; padding: 7px 12px; font: 600 13px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
                  box-shadow: 0 0 0 2px #E87C3E; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px; }
    .lsc-event { background: var(--lsc-navy); border-top: 3px solid #E87C3E; color: #FFFFFF; border-radius: 10px;
                 padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
    .lsc-event img { width: 88px; height: 72px; flex: none; object-fit: contain; }
    .lsc-event .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
    .lsc-event .ttl { font: 700 20px/1.1 Bitter, Georgia, serif; }
    .lsc-event .sub { font-size: 12.5px; opacity: .9; }
    /* the in-page tab bar stays in view (the body's own .seg) */
    .wrap .lsc-info .seg { position: sticky; top: 0; z-index: 2; }
    @media print {
      .bar { display: none; }
      .wrap { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <img src="/static/tgf-icon-white.svg" alt="TGF">
    <a class="back" href="/member/lonestarcup{{ '?preview=1' if preview else '' }}">Lone Star Cup</a>
  </div>
  <div class="wrap">
    <div class="lsc-event">
      <img src="/static/lsc-logo-dark.png" alt="Lone Star Cup 2026">
      <div>
        <div class="lbl">Event information</div>
        <div class="ttl">The Lone Star Cup 2026</div>
        <div class="sub">Austin v San Antonio · October 9–11 · The Hideout Golf Club, Brownwood</div>
      </div>
    </div>
    {% include "_lsc_info_body.html" %}
  </div>
  <script src="/static/js/lsc-info.js"></script>
  <script>
    (function () {
      const show = window.lscInfoWire(document.querySelector(".wrap"), {
        key: location.hash, scroll: true,
        onPick: (k) => history.replaceState(null, "", "#" + k),
      });
      window.addEventListener("hashchange", () => show(location.hash, true));
      // Download PDF from the Cup tab opens this page with ?print=1
      if (new URLSearchParams(location.search).get("print") === "1")
        window.addEventListener("load", () => setTimeout(() => window.print(), 300));
    })();
  </script>
</body>
</html>
