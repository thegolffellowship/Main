<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TGF Tracker</title>
  <style>
    /* THE PAGE ASKS FOR THE PIN (Kerry 2026-09-28: a scorecards link opened
       from outside the Tracker app showed raw JSON). A signed-out visit to
       any page route lands here, signs in, and reloads the same address. */
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1B1B1B; font-family: "Helvetica Neue", Arial, system-ui, sans-serif; }
    .box { background: #fff; border-radius: 12px; padding: 28px 24px; width: min(340px, 92vw);
      text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-family: Georgia, serif; font-size: 20px; margin: 10px 0 4px; }
    p { color: #4B5563; font-size: 14px; margin: 0 0 16px; }
    input { font-size: 22px; letter-spacing: 6px; text-align: center; width: 100%; box-sizing: border-box;
      padding: 10px; border: 2px solid #D1D5DB; border-radius: 8px; }
    input:focus { outline: none; border-color: #E87C3E; }
    button { margin-top: 12px; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; border: 0;
      border-radius: 999px; background: #E87C3E; color: #fff; }
    .err { color: #C0392B; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <form class="box" onsubmit="return signIn(event)">
    <img src="/static/tgf-logo-r.svg" alt="TGF">
    <h1>Sign in to open this page</h1>
    <p>This browser isn't signed in to the Tracker yet. Enter your PIN and the page opens.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    function signIn(e) {
      e.preventDefault();
      var err = document.getElementById('err');
      err.style.display = 'none';
      fetch('/api/auth/login', {method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pin: document.getElementById('pin').value.trim()})})
        .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
        .then(function (x) {
          if (!x[0]) { err.textContent = (x[1] && x[1].error) || 'Sign-in failed.'; err.style.display = 'block'; return; }
          location.reload();
        }).catch(function () { err.textContent = 'Connection error. Try again.'; err.style.display = 'block'; });
      return false;
    }
  </script>
</body>
</html>
