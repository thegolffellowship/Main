# Nixpacks build configuration for Railway
# Golf Genius sync uses HTTP requests (no browser/Playwright required for it).
#
# The print-pack PDF (v2.465.8) renders through headless CHROMIUM — the same
# engine as the browser's Download PDF — driven by Playwright with the Nix
# chromium as executable_path (no browser download at build time). Nix
# libraries keep WeasyPrint importable as the fallback engine.
# NOTE: nixPkgs REPLACES the provider list, so python3 + gcc are repeated.
[phases.setup]
nixPkgs = ["python3", "gcc", "chromium"]
# stdenv.cc.cc.lib + zlib: the Nix Python cannot see the image's
# libstdc++, so `import playwright` (greenlet) failed with
# "libstdc++.so.6: cannot open shared object file" (v2.465.12 note).
nixLibs = ["glib", "pango", "harfbuzz", "fontconfig", "cairo", "gdk-pixbuf", "libffi", "stdenv.cc.cc.lib", "zlib"]
aptPkgs = ["fonts-dejavu-core", "shared-mime-info"]
