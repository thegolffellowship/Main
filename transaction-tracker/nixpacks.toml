# Nixpacks build configuration for Railway
# Golf Genius sync uses HTTP requests (no browser/Playwright required).
#
# WeasyPrint (the print-pack PDF engine, v2.465.4) loads Pango, HarfBuzz,
# FontConfig, GObject and Cairo by name at runtime; the nixpacks image is
# Ubuntu, so they come from apt. Nothing else here needs a browser.
[phases.setup]
aptPkgs = ["libpango-1.0-0", "libpangoft2-1.0-0", "libharfbuzz0b", "libharfbuzz-subset0",
           "libfontconfig1", "libglib2.0-0", "libcairo2", "libgdk-pixbuf-2.0-0",
           "libffi8", "shared-mime-info", "fonts-dejavu-core"]
