# Nixpacks build configuration for Railway
# No special system packages or build commands needed — Golf Genius sync
# uses HTTP requests (no browser/Playwright required).


# WeasyPrint (the print-pack PDF engine, v2.465.0) needs Pango/Cairo at
# runtime. Nothing else here needs a browser.
[phases.setup]
aptPkgs = ["libpango-1.0-0", "libpangoft2-1.0-0", "libharfbuzz0b", "libcairo2",
           "libgdk-pixbuf-2.0-0", "libffi8", "shared-mime-info", "fonts-dejavu-core"]
